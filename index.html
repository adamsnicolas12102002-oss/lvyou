<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>你的旅行人格</title>
  <style>
    :root {
      --blue: #2f84ff;
      --deep-blue: #1462ee;
      --sky: #7fd4ff;
      --ink: #131722;
      --muted: #647087;
      --line: rgba(28, 89, 179, 0.14);
      --yellow: #ffd84b;
      --green: #3fd48d;
      --pink: #ff67aa;
      --lavender: #b59cff;
      --paper: rgba(255, 255, 255, 0.86);
      --shadow: 0 18px 50px rgba(38, 91, 157, 0.22);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 237, 147, 0.65), transparent 22rem),
        radial-gradient(circle at 88% 6%, rgba(127, 212, 255, 0.7), transparent 18rem),
        linear-gradient(135deg, #d9f6ff 0%, #eff8ff 42%, #ffe8db 100%);
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 18px;
      overflow-x: hidden;
    }

    button {
      border: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .phone {
      position: relative;
      width: min(100%, 390px);
      height: min(844px, calc(100vh - 24px));
      min-height: 720px;
      border-radius: 34px;
      overflow: hidden;
      background: #f7fbff;
      box-shadow: 0 26px 80px rgba(30, 82, 136, 0.28);
      isolation: isolate;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      padding: max(24px, env(safe-area-inset-top)) 22px 24px;
      overflow: hidden;
    }

    .screen.active {
      display: block;
      animation: popIn 360ms ease both;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .status {
      display: none;
    }

    .status-icons {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .signal {
      display: inline-flex;
      gap: 2px;
      align-items: end;
      height: 12px;
    }

    .signal i {
      display: block;
      width: 3px;
      border-radius: 3px;
      background: #0e1118;
    }

    .signal i:nth-child(1) { height: 4px; }
    .signal i:nth-child(2) { height: 7px; }
    .signal i:nth-child(3) { height: 10px; }

    .wifi {
      width: 15px;
      height: 11px;
      border: 3px solid #0e1118;
      border-bottom: 0;
      border-left-color: transparent;
      border-right-color: transparent;
      border-radius: 14px 14px 0 0;
      transform: translateY(1px);
    }

    .battery {
      position: relative;
      width: 22px;
      height: 11px;
      border: 2px solid #0e1118;
      border-radius: 4px;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -4px;
      top: 3px;
      width: 2px;
      height: 4px;
      border-radius: 0 2px 2px 0;
      background: #0e1118;
    }

    .battery::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 13px;
      height: 3px;
      border-radius: 4px;
      background: #0e1118;
    }

    .icon-btn {
      position: relative;
      z-index: 5;
      width: 36px;
      height: 36px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      color: #152135;
      box-shadow: 0 8px 20px rgba(61, 130, 204, 0.16);
      backdrop-filter: blur(10px);
      font-size: 22px;
      line-height: 1;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 36px;
    }

    .primary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 58px;
      padding: 0 28px;
      border-radius: 24px;
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      background: linear-gradient(180deg, #5db2ff 0%, #2274ff 100%);
      box-shadow: 0 13px 24px rgba(23, 111, 238, 0.33), inset 0 1px 0 rgba(255,255,255,0.5);
      white-space: nowrap;
    }

    .secondary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 48px;
      padding: 0 18px;
      border: 2px solid rgba(42, 123, 245, 0.22);
      border-radius: 22px;
      color: var(--deep-blue);
      font-size: 16px;
      font-weight: 900;
      background: rgba(255, 255, 255, 0.76);
    }

    .cover {
      padding: 0;
      background: #8fd8ff;
    }

    .cover::before,
    .cover::after {
      display: none;
    }

    .cover-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-height: none;
      object-fit: cover;
      object-position: center;
      transform: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .cover::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      display: block;
      background: linear-gradient(180deg, rgba(112, 205, 255, 0.06) 0%, rgba(112, 205, 255, 0) 44%, rgba(255, 255, 255, 0.08) 100%);
      pointer-events: none;
    }

    .cover .icon-btn,
    .cover .doodle,
    .cover .cover-title,
    .cover .marker,
    .cover .paper-tape,
    .cover .sticker,
    .cover .cover-panel {
      z-index: 3;
    }

    .cover .icon-btn {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: 18px;
    }

    .cover-title {
      margin-top: max(58px, calc(env(safe-area-inset-top) + 48px));
    }

    .doodle {
      position: absolute;
      z-index: 1;
      color: #15315a;
      font-weight: 900;
      text-shadow: 0 2px 0 #fff;
      pointer-events: none;
    }

    .doodle.star-a { top: 92px; right: 66px; font-size: 24px; color: #ffd925; }
    .doodle.star-b { top: 112px; left: 64px; font-size: 20px; color: #fff; transform: rotate(-25deg); }
    .doodle.plane { top: 200px; right: 48px; font-size: 30px; color: #fff; transform: rotate(24deg); }
    .doodle.pin { left: 30px; top: 312px; font-size: 27px; color: #ffb51f; }

    .cover-title {
      position: relative;
      z-index: 2;
      margin: max(58px, calc(env(safe-area-inset-top) + 48px)) 0 0;
      text-align: center;
      line-height: 0.96;
      letter-spacing: 0;
      font-size: 52px;
      font-weight: 1000;
      text-shadow:
        0 4px 0 #fff,
        3px 0 0 #fff,
        -3px 0 0 #fff,
        0 10px 20px rgba(10, 85, 162, 0.22);
    }

    .cover-title span {
      display: block;
    }

    .cover-title .blue {
      color: #1677ff;
      font-size: 56px;
    }

    .cover-title .black {
      color: #121621;
    }

    .marker {
      display: block;
      width: 160px;
      height: 13px;
      margin: 4px auto 0;
      border-radius: 50%;
      background: #ffe04e;
      transform: rotate(-4deg);
    }

    .paper-tape {
      position: relative;
      z-index: 3;
      width: max-content;
      max-width: 100%;
      margin: 18px auto 8px;
      padding: 12px 22px;
      border-radius: 16px 12px 18px 10px;
      background: #fff8df;
      color: #2a2620;
      font-size: 16px;
      font-weight: 900;
      box-shadow: 0 7px 0 rgba(255, 205, 61, 0.36);
      transform: rotate(-2.4deg);
    }

    .paper-tape::before,
    .paper-tape::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 16px;
      height: 16px;
      background: #ffbd2f;
      border-radius: 5px;
      transform: translateY(-50%) rotate(28deg);
    }

    .paper-tape::before { left: -7px; }
    .paper-tape::after { right: -7px; }

    .hero-scene {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 154px;
      height: 360px;
    }

    .sea {
      position: absolute;
      left: -22px;
      right: -22px;
      bottom: 0;
      height: 110px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.85) 0 8px, transparent 8px),
        repeating-linear-gradient(-8deg, #29a7ef 0 18px, #1987da 18px 34px);
      border-top-left-radius: 50% 28px;
      border-top-right-radius: 50% 28px;
    }

    .island {
      position: absolute;
      right: 13px;
      bottom: 80px;
      width: 132px;
      height: 120px;
    }

    .palm-trunk {
      position: absolute;
      left: 48px;
      top: 30px;
      width: 14px;
      height: 92px;
      border-radius: 8px;
      background: linear-gradient(90deg, #a96a30, #d38c3d);
      transform: rotate(11deg);
    }

    .palm-leaf {
      position: absolute;
      top: 16px;
      left: 52px;
      width: 70px;
      height: 22px;
      border-radius: 100% 0 100% 0;
      background: #27bd6f;
      transform-origin: left center;
    }

    .palm-leaf:nth-child(2) { transform: rotate(-46deg); }
    .palm-leaf:nth-child(3) { transform: rotate(-16deg); }
    .palm-leaf:nth-child(4) { transform: rotate(18deg); }
    .palm-leaf:nth-child(5) { transform: rotate(50deg); }

    .traveler {
      position: absolute;
      left: 72px;
      bottom: 54px;
      width: 192px;
      height: 252px;
      filter: drop-shadow(0 12px 18px rgba(90, 64, 35, 0.22));
    }

    .hair {
      position: absolute;
      left: 54px;
      top: 55px;
      width: 82px;
      height: 88px;
      background: #7d3e22;
      border-radius: 46% 46% 52% 52%;
      transform: rotate(-10deg);
    }

    .hair::before,
    .hair::after {
      content: "";
      position: absolute;
      background: #7d3e22;
      border-radius: 50%;
    }

    .hair::before {
      left: -24px;
      top: 38px;
      width: 46px;
      height: 62px;
      transform: rotate(20deg);
    }

    .hair::after {
      right: -21px;
      top: 34px;
      width: 42px;
      height: 68px;
      transform: rotate(-14deg);
    }

    .hat {
      position: absolute;
      left: 28px;
      top: 29px;
      width: 132px;
      height: 42px;
      border-radius: 50%;
      background: #f6df9d;
      transform: rotate(-9deg);
      box-shadow: inset 0 -7px 0 #d2a95d;
      z-index: 3;
    }

    .hat::before {
      content: "";
      position: absolute;
      left: 39px;
      top: -38px;
      width: 62px;
      height: 58px;
      border-radius: 50% 50% 42% 42%;
      background: #f9e8b6;
      box-shadow: inset 0 -6px 0 #d9b66c;
    }

    .face {
      position: absolute;
      left: 60px;
      top: 76px;
      width: 74px;
      height: 72px;
      border-radius: 48% 48% 44% 44%;
      background: #ffd3a7;
      z-index: 4;
    }

    .glasses {
      position: absolute;
      left: 54px;
      top: 102px;
      z-index: 6;
      display: flex;
      gap: 6px;
      transform: rotate(-4deg);
    }

    .glasses i {
      display: block;
      width: 27px;
      height: 25px;
      border-radius: 50%;
      background: #11141b;
      border: 3px solid #fff0b7;
    }

    .smile {
      position: absolute;
      left: 88px;
      top: 130px;
      z-index: 7;
      width: 18px;
      height: 9px;
      border: 3px solid #a54b37;
      border-top: 0;
      border-radius: 0 0 20px 20px;
    }

    .body {
      position: absolute;
      left: 48px;
      top: 143px;
      width: 92px;
      height: 96px;
      border-radius: 30px 30px 22px 22px;
      background: #ffd15b;
      z-index: 3;
    }

    .strap {
      position: absolute;
      left: 77px;
      top: 146px;
      width: 14px;
      height: 100px;
      border-radius: 12px;
      background: #5a3c2d;
      transform: rotate(-14deg);
      z-index: 5;
    }

    .map {
      position: absolute;
      left: 14px;
      top: 143px;
      width: 91px;
      height: 63px;
      background:
        linear-gradient(90deg, transparent 31%, rgba(20, 74, 140, 0.12) 31% 34%, transparent 34% 65%, rgba(20, 74, 140, 0.12) 65% 68%, transparent 68%),
        linear-gradient(135deg, #fffdf0, #d8f4ff);
      border: 3px solid #fff;
      border-radius: 8px;
      transform: rotate(10deg);
      box-shadow: 0 8px 14px rgba(42, 88, 139, 0.17);
      z-index: 8;
    }

    .map::before,
    .map::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: #37bf7c;
    }

    .map::before {
      left: 12px;
      top: 17px;
      width: 26px;
      height: 7px;
      transform: rotate(-23deg);
    }

    .map::after {
      right: 10px;
      bottom: 14px;
      width: 31px;
      height: 8px;
      background: #2f84ff;
      transform: rotate(20deg);
    }

    .camera {
      position: absolute;
      right: 19px;
      bottom: 14px;
      z-index: 9;
      width: 56px;
      height: 42px;
      border-radius: 12px;
      background: #202a3a;
      border: 4px solid #eef8ff;
      box-shadow: 0 7px 12px rgba(20, 39, 68, 0.24);
    }

    .camera::before {
      content: "";
      position: absolute;
      left: 16px;
      top: 8px;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: #77c7ff;
      border: 4px solid #fff;
    }

    .suitcase {
      position: absolute;
      left: 86px;
      bottom: -5px;
      width: 130px;
      height: 116px;
      border-radius: 24px 24px 18px 18px;
      background: linear-gradient(180deg, #f6b736, #df8d1f);
      box-shadow: inset 10px 0 0 rgba(255,255,255,0.15), inset -12px 0 0 rgba(98,55,17,0.1);
      z-index: 2;
    }

    .suitcase::before {
      content: "";
      position: absolute;
      left: 42px;
      top: -18px;
      width: 43px;
      height: 22px;
      border: 7px solid #b36b1c;
      border-bottom: 0;
      border-radius: 18px 18px 0 0;
    }

    .sticker {
      position: absolute;
      display: grid;
      place-items: center;
      min-width: 76px;
      height: 35px;
      padding: 0 11px;
      border: 3px solid #fff;
      border-radius: 17px;
      color: #fff;
      font-size: 14px;
      font-weight: 1000;
      box-shadow: 0 7px 16px rgba(47, 102, 170, 0.18);
    }

    .sticker.a {
      left: 21px;
      top: clamp(330px, 45%, 390px);
      background: #3d91ff;
      transform: rotate(-3deg);
    }

    .sticker.b {
      right: 28px;
      top: clamp(370px, 50%, 430px);
      background: #ffad28;
      transform: rotate(4deg);
    }

    .sticker.c {
      left: 24px;
      top: clamp(455px, 61%, 525px);
      background: #2ecc78;
      transform: rotate(1deg);
    }

    .cover-panel {
      position: absolute;
      z-index: 10;
      left: 18px;
      right: 18px;
      bottom: max(18px, env(safe-area-inset-bottom));
      padding: 20px 16px 18px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .avatars {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      color: #4e5d72;
      font-size: 13px;
      font-weight: 800;
    }

    .avatar-stack {
      display: flex;
    }

    .avatar {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      margin-left: -7px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffe1a6, #8fd4ff);
      font-size: 14px;
    }

    .avatar:first-child {
      margin-left: 0;
    }

    .cover-panel .primary-btn {
      width: 100%;
    }

    .quiz,
    .detail {
      background:
        radial-gradient(circle at 80% 9%, rgba(126, 197, 255, 0.32), transparent 128px),
        radial-gradient(circle at 5% 84%, rgba(255, 219, 84, 0.18), transparent 136px),
        linear-gradient(180deg, #fbfdff 0%, #eff8ff 100%);
    }

    .question-count {
      text-align: center;
      font-size: 18px;
      font-weight: 1000;
      margin-top: 4px;
    }

    .progress {
      height: 13px;
      width: 100%;
      margin: 20px 0 35px;
      padding: 3px;
      border-radius: 999px;
      background: #cde4ff;
      box-shadow: inset 0 2px 4px rgba(26, 86, 160, 0.12);
    }

    .bar {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #387dff, #43b5ff);
      box-shadow: 0 3px 8px rgba(34, 113, 244, 0.3);
      transition: width 260ms ease;
    }

    .question-title {
      position: relative;
      margin: 0 0 28px;
      text-align: center;
      font-size: 26px;
      line-height: 1.25;
      font-weight: 1000;
      letter-spacing: 0;
    }

    .question-title::after {
      content: "";
      display: block;
      width: 108px;
      height: 9px;
      margin: 6px auto 0;
      border-radius: 50%;
      background: #2f84ff;
      transform: rotate(-3deg);
      opacity: 0.9;
      mask: radial-gradient(circle at 10% 70%, transparent 0 3px, #000 4px) left / 16px 9px repeat-x;
    }

    .options {
      display: grid;
      gap: 16px;
    }

    .option {
      position: relative;
      min-height: 118px;
      display: grid;
      grid-template-columns: 116px 1fr 30px;
      align-items: center;
      gap: 8px;
      padding: 14px 14px 14px 12px;
      border: 2px solid transparent;
      border-radius: 25px;
      background: linear-gradient(135deg, #d9f0ff, #eef8ff);
      box-shadow: 0 12px 22px rgba(42, 116, 197, 0.12);
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .option:nth-child(2) {
      background: linear-gradient(135deg, #fff5c8, #fffaf0);
    }

    .option:nth-child(3) {
      background: linear-gradient(135deg, #f1e7ff, #f8f4ff);
    }

    .option:nth-child(4) {
      background: linear-gradient(135deg, #c9f7e4, #effff7);
    }

    .option:hover,
    .option.selected {
      transform: translateY(-2px);
      border-color: #3d82ff;
      box-shadow: 0 14px 28px rgba(42, 116, 197, 0.2);
    }

    .option-text {
      font-size: 18px;
      line-height: 1.32;
      font-weight: 1000;
    }

    .option-sub {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .radio {
      width: 24px;
      height: 24px;
      border: 3px solid #9dccff;
      border-radius: 50%;
      background: #edf7ff;
    }

    .option.selected .radio {
      display: grid;
      place-items: center;
      border-color: #2f84ff;
      background: #2f84ff;
    }

    .option.selected .radio::after {
      content: "✓";
      color: #fff;
      font-size: 15px;
      font-weight: 1000;
    }

    .option-art {
      position: relative;
      height: 86px;
      border-radius: 20px;
      overflow: hidden;
      background:
        radial-gradient(circle at 26% 22%, rgba(255,255,255,0.92), transparent 16px),
        linear-gradient(135deg, rgba(255,255,255,0.45), rgba(255,255,255,0.05));
    }

    .art-emoji {
      position: absolute;
      left: 15px;
      top: 12px;
      font-size: 42px;
      filter: drop-shadow(0 6px 4px rgba(0,0,0,0.09));
    }

    .art-bubble {
      position: absolute;
      right: 11px;
      top: 12px;
      font-size: 28px;
    }

    .art-person {
      position: absolute;
      left: 24px;
      bottom: 6px;
      width: 47px;
      height: 47px;
      border-radius: 50% 50% 45% 45%;
      background: #ffd1a0;
      box-shadow: inset 0 -12px 0 #ffd15f, 0 8px 12px rgba(60, 83, 117, 0.12);
    }

    .art-person::before {
      content: "";
      position: absolute;
      left: 5px;
      top: -8px;
      width: 38px;
      height: 22px;
      border-radius: 50% 50% 20% 20%;
      background: #6e3b24;
    }

    .art-person::after {
      content: "";
      position: absolute;
      left: 14px;
      top: 20px;
      width: 20px;
      height: 9px;
      border: 3px solid #7a3124;
      border-top: 0;
      border-radius: 0 0 20px 20px;
    }

    .quiz-footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 25px;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .quiz-footer button {
      min-width: 214px;
      pointer-events: auto;
    }

    .result {
      background:
        radial-gradient(circle at 75% 16%, rgba(255,255,255,0.85), transparent 56px),
        radial-gradient(circle at 20% 20%, rgba(255,239,134,0.5), transparent 110px),
        linear-gradient(180deg, #a7dfff 0%, #eaf8ff 48%, #fff8e8 100%);
      padding: 42px 16px 16px;
      overflow-y: auto;
    }

    function calculateResult() {
      const totals = { action: 0, vibe: 0, planner: 0, photo: 0, chill: 0, lost: 0 };
      state.answers.forEach((answer, questionIndex) => {
        if (answer === null) return;
        const scores = questions[questionIndex].options[answer].scores;
        Object.entries(scores).forEach(([key, value]) => {
          totals[key] += value;
        });
      });
      const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);
      state.resultKey = sorted[0][0];
      const top = sorted[0][1];
      const second = sorted[1][1];
      state.score = Math.max(82, Math.min(98, 88 + (top - second) * 2 + Math.floor(Math.random() * 4)));
      renderResult();
    }

      if (sourceRatio > targetRatio) {

      } else {

        sy = (image.naturalHeight - sh) / 2;
      }
      ctx.drawImage(image, sx, sy, sw, sh, x, y, width, height);
    }

    function drawPosterText(ctx, text, x, y, options = {}) {
      ctx.save();
      ctx.textAlign = options.align || "center";
      ctx.textBaseline = options.baseline || "middle";
      ctx.lineWidth = options.strokeWidth || 0;
      ctx.font = options.font;
      if (options.strokeStyle && options.strokeWidth) {
        ctx.strokeStyle = options.strokeStyle;
        ctx.strokeText(text, x, y);
      }
      ctx.fillStyle = options.fillStyle || "#111";
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function fitCanvasText(ctx, text, maxWidth, startSize, weight = 900, minSize = 24) {
      let size = startSize;
      do {
        ctx.font = `${weight} ${size}px Microsoft YaHei, PingFang SC, sans-serif`;
        if (ctx.measureText(text).width <= maxWidth || size <= minSize) break;
        size -= 2;
      } while (size > minSize);
      return size;
    }

    function downloadUrl(url, filename) {
      const link = document.createElement("a");
      link.download = filename;
      link.href = url;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function canvasToBlob(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error("图片生成失败"));
        }, "image/png");
      });
    }

    async function shareOrDownloadPoster(blob, filename) {
      const file = new File([blob], filename, { type: "image/png" });
      if (navigator.canShare?.({ files: [file] }) && navigator.share) {
        let shared = false;
        try {
          await Promise.race([
            navigator.share({
              files: [file],
              title: "我的旅行人格",
              text: "我的旅行人格测试结果"
            }).then(() => { shared = true; }),
            new Promise((resolve) => window.setTimeout(resolve, 6000))
          ]);
          if (shared) {
            showToast("已打开分享面板");
            return;
          }
        } catch (error) {
          if (error.name === "AbortError") {
            showToast("已取消分享");
            return;
          }
        }
      }
      const url = URL.createObjectURL(blob);
      downloadUrl(url, filename);
      window.setTimeout(() => URL.revokeObjectURL(url), 1200);
      showToast("已生成图片，可转发给好友");
    }

    async function savePoster() {
      const result = results[state.resultKey];
      try {
        showToast("正在生成图片...");
        const posterImageAssets = await ensurePosterImageAssets();
        const posterImage = result.posterImage || result.image;
        const persona = await loadImage(posterImageAssets[posterImage] || posterImage);
        const canvas = document.createElement("canvas");
        canvas.width = 780;
        canvas.height = 1480;
        const ctx = canvas.getContext("2d");

        const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bg.addColorStop(0, "#a8e5ff");
        bg.addColorStop(0.42, "#e9f8ff");
        bg.addColorStop(1, "#f7fcff");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawCloud(ctx, 82, 164, 0.55);
        drawCloud(ctx, 642, 212, 0.44);
        drawStar(ctx, 68, 88, 20, "#ffd84b");
        drawStar(ctx, 712, 104, 17, "#ff73ad");

        drawPosterText(ctx, "✨ 你的旅行人格是 ✨", 390, 70, {
          font: "900 44px Microsoft YaHei, sans-serif",
          fillStyle: "#111827"
        });

        ctx.fillStyle = "#ffd84b";
        roundRect(ctx, 124, 212, 532, 34, 16);
        ctx.fill();
        ctx.fillStyle = "#2f84ff";
        roundRect(ctx, 106, 124, 568, 116, 16);
        ctx.fill();
        const nameSize = fitCanvasText(ctx, result.name, 500, 74, 1000, 42);
        drawPosterText(ctx, result.name, 390, 182, {
          font: `1000 ${nameSize}px Microsoft YaHei, sans-serif`,
          fillStyle: "#fff"
        });

        ctx.fillStyle = "#fff";
        roundRect(ctx, 36, 258, 708, 708, 42);
        ctx.fill();
        ctx.save();
        roundRect(ctx, 54, 276, 672, 672, 32);
        ctx.clip();
        drawCoverImage(ctx, persona, 54, 276, 672, 672);
        ctx.restore();

        ctx.fillStyle = "rgba(255,255,255,0.94)";
        roundRect(ctx, 32, 994, 716, 352, 28);
        ctx.fill();

        ctx.font = "900 24px Microsoft YaHei, sans-serif";
        let tagX = 108;
        let tagY = 1026;
        result.tags.forEach((tag) => {
          const pillW = Math.max(110, ctx.measureText(tag).width + 34);
          if (tagX + pillW > 690) {
            tagX = 108;
            tagY += 58;
          }
          ctx.fillStyle = "#e7f4ff";
          roundRect(ctx, tagX, tagY, pillW, 40, 14);
          ctx.fill();
          drawPosterText(ctx, tag, tagX + pillW / 2, tagY + 21, {
            font: "900 22px Microsoft YaHei, sans-serif",
            fillStyle: "#2f84ff"
          });
          tagX += pillW + 14;
        });

        drawPosterText(ctx, "人格匹配度", 390, 1132, {
          font: "900 24px Microsoft YaHei, sans-serif",
          fillStyle: "#596273"
        });
        drawPosterText(ctx, `${state.score}%`, 390, 1198, {
          font: "1000 78px Microsoft YaHei, sans-serif",
          fillStyle: "#2f84ff"
        });

        ctx.fillStyle = "#d8ecff";
        roundRect(ctx, 62, 1248, 656, 24, 12);
        ctx.fill();
        ctx.fillStyle = "#4ba0ff";
        roundRect(ctx, 62, 1248, 656 * state.score / 100, 24, 12);
        ctx.fill();

        const statRows = [
          ["攻略能力", result.stats[0], "#4ba0ff"],
          ["冒险精神", result.stats[1], "#ff70ad"],
          ["社交需求", result.stats[2], "#41d482"],
          ["放松指数", result.stats[3], "#ffd034"]
        ];
        statRows.forEach(([label, value, color], index) => {
          const y = 1300 + index * 32;
          drawPosterText(ctx, label, 96, y, {
            align: "left",
            font: "900 20px Microsoft YaHei, sans-serif",
            fillStyle: "#1f2937"
          });
          ctx.fillStyle = "#e8f0f7";
          roundRect(ctx, 220, y - 10, 340, 18, 9);
          ctx.fill();
          ctx.fillStyle = color;
          roundRect(ctx, 220, y - 10, 340 * value / 100, 18, 9);
          ctx.fill();
          drawPosterText(ctx, `${value}%`, 662, y, {
            align: "right",
            font: "900 20px Microsoft YaHei, sans-serif",
            fillStyle: "#1f2937"
          });
        });

        const blob = await canvasToBlob(canvas);
        await shareOrDownloadPoster(blob, `我的旅行人格-${result.name}.png`);
      } catch (error) {
        console.error("保存图片失败", error);
        showToast(`分享失败：${error.message || "请重试"}`);
      }
    }

    function drawCloud(ctx, x, y, scale) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = "rgba(255,255,255,0.88)";
      ctx.beginPath();
      ctx.arc(0, 0, 36, 0, Math.PI * 2);
      ctx.arc(42, -12, 46, 0, Math.PI * 2);
      ctx.arc(88, 2, 32, 0, Math.PI * 2);
      ctx.fillRect(-4, 0, 112, 34);
      ctx.fill();
      ctx.restore();
    }

    function drawStar(ctx, x, y, r, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = color;
      ctx.beginPath();
      for (let i = 0; i < 8; i += 1) {
        const angle = (Math.PI / 4) * i;
        const radius = i % 2 === 0 ? r : r * 0.38;
        ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawMiniRunner(ctx, x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(1.5, 1.5);
      ctx.fillStyle = "#d7f0df";
      ctx.fillRect(-145, 170, 320, 72);
      ctx.fillStyle = "#b7d7ef";
      ctx.beginPath();
      ctx.moveTo(-150, 170); ctx.lineTo(-78, 72); ctx.lineTo(-15, 170); ctx.lineTo(45, 88); ctx.lineTo(138, 170); ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#273048";
      ctx.lineCap = "round";
      ctx.lineWidth = 12;
      ctx.beginPath();
      ctx.moveTo(-35, 40); ctx.lineTo(-82, 86);
      ctx.moveTo(40, 58); ctx.lineTo(90, 104);
      ctx.moveTo(-10, 132); ctx.lineTo(-68, 190);
      ctx.moveTo(42, 132); ctx.lineTo(98, 188);
      ctx.stroke();

      ctx.fillStyle = "#b27b3e";
      roundRect(ctx, -80, 42, 58, 84, 18);
      ctx.fill();

      ctx.fillStyle = "#f4f6f8";
      roundRect(ctx, -22, 64, 82, 92, 24);
      ctx.fill();
      ctx.strokeStyle = "#273048";
      ctx.lineWidth = 8;
      ctx.stroke();

      ctx.fillStyle = "#ffd0a1";
      ctx.beginPath();
      ctx.arc(28, 24, 34, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#273048";
      ctx.beginPath();
      ctx.ellipse(25, 2, 42, 20, 0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#802522";
      ctx.beginPath();
      ctx.arc(40, 38, 10, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fffbe9";
      roundRect(ctx, 70, 112, 58, 42, 7);
      ctx.fill();
      ctx.restore();
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      let line = "";
      const chars = [...text];
      chars.forEach((char, index) => {
        const testLine = line + char;
        if (ctx.measureText(testLine).width > maxWidth && line) {
          ctx.fillText(line, x, y);
          line = char;
          y += lineHeight;
        } else {
          line = testLine;
        }
        if (index === chars.length - 1) ctx.fillText(line, x, y);
      });
    }

    document.addEventListener("click", (event) => {
      const option = event.target.closest("[data-option]");
      if (option) {
        pickAnswer(Number(option.dataset.option));
        return;
      }

      const action = event.target.closest("[data-action]")?.dataset.action;
      if (!action) return;

      const actions = {
        start: () => { state.current = 0; renderQuestion(); showScreen("quiz"); },
        back: previousQuestion,
        next: nextQuestion,
        restart,
        home: () => showScreen("cover"),
        detail: () => showScreen("detail"),
        result: () => showScreen("result"),
        poster: savePoster,
        copy: copyShareText,
        save: savePoster
      };
      actions[action]?.();
    });

    renderQuestion();
  </script>
</body>
